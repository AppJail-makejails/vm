build:
  variants:
    - tag: 15.1
      containerfile: Containerfile
      aliases: ["latest"]
      default: true
      args:
        FREEBSD_RELEASE: "15.1"
        NO_PKGCLEAN: "1"
      cache_dirs: ["pkgcache0:/var/cache/pkg"]
    - tag: 15.1-tor
      containerfile: Containerfile
      aliases: ["tor"]
      args:
        FREEBSD_RELEASE: "15.1"
        NO_PKGCLEAN: "1"
        IS_TOR: "1"
      cache_dirs: ["pkgcache0:/var/cache/pkg"]
